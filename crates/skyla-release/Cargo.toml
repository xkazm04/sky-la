[package]
name = "skyla-release"
description = "Release tooling: version checks, checksums, the signed update manifest."
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
minisign = "0.10.0"
serde_json = "1.0.151"
sha2 = "0.11.0"

[dev-dependencies]
minisign-verify = "0.3.0"
tempfile = "3.27.0"

[[bin]]
name = "skyla-release"
path = "src/main.rs"
