[package]
name = "skyla-ledger"
description = "Double-entry ledger kernel: accounts, journal entries, invariants, periods and projections."
license = "Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
skyla-money = { version = "0.1.0", path = "../skyla-money" }
thiserror = "2.0.21"
toml = "1.1.6"
uuid = { version = "1.27.0", features = ["v7"] }

[dev-dependencies]
insta = "1.49.0"
proptest = "1.11.0"
serde_json = "1.0.151"
