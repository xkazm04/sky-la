[package]
name = "skyla-invoicing"
description = "Invoices and credit notes: number series, lifecycle, ISDOC, UBL and CII writers, SPAYD."
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
skyla-ledger = { version = "0.1.0", path = "../skyla-ledger" }
skyla-money = { version = "0.1.0", path = "../skyla-money" }
skyla-rules = { version = "0.1.0", path = "../skyla-rules" }
thiserror = "2.0.21"
uuid = { version = "1.27.0", features = ["v7"] }

[dev-dependencies]
proptest = "1.11.0"
