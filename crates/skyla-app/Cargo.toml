[package]
name = "skyla-app"
description = "Application services behind the desktop shell's commands: typed DTOs, the demo core and IPC recordings."
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
uuid = { version = "1.27.0", features = ["v4", "v5"] }
base64 = "0.22.1"
skyla-bank = { version = "0.1.0", path = "../skyla-bank" }
ureq = "3.4.2"
skyla-advisor = { version = "0.1.0", path = "../skyla-advisor" }
skyla-egress = { version = "0.1.0", path = "../skyla-egress" }
skyla-store = { version = "0.1.0", path = "../skyla-store" }
skyla-tax-cz = { version = "0.1.0", path = "../skyla-tax-cz" }
crc32fast = "1.5.2"
flate2 = "1.1.10"
minisign-verify = "0.3.0"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
serde_json = "1.0.151"
skyla-invoicing = { version = "0.1.0", path = "../skyla-invoicing" }
skyla-ledger = { version = "0.1.0", path = "../skyla-ledger" }
skyla-money = { version = "0.1.0", path = "../skyla-money" }
skyla-render = { version = "0.1.0", path = "../skyla-render" }
skyla-rules = { version = "0.1.0", path = "../skyla-rules" }
# Pinned: specta 2 is a release candidate (STATUS backlog).
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
minisign = "0.10.0"
skyla-mcp = { version = "0.1.0", path = "../skyla-mcp" }
tempfile = "3.27.0"
