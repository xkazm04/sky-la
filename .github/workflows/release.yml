name: release

# A tag `vX.Y.Z` builds the desktop bundles on each platform, signs them
# where the maintainer's secrets are set, and publishes a draft release with
# SHA256SUMS, an SBOM and the signed update manifest (latest.json). A manual
# run builds the same bundles as artifacts without publishing anything.
# See docs/RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege; only the publish job may write (to create the release).
# Every action is pinned to a commit, its tag in the comment.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: bundle (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported glibc, so the AppImage and .deb run on older systems.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-14
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: ${{ matrix.target }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev file
      - run: pnpm install --frozen-lockfile
      - name: The tag, the crates, the shell and the changelog agree
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: cargo run -q --locked -p skyla-release -- check-version "$GITHUB_REF_NAME"
      - name: Build the MCP shim the advisors start
        shell: bash
        run: |
          cargo build --release --locked -p skyla-mcp --target ${{ matrix.target }}
          cargo run -q --locked -p skyla-release -- stage-shim ${{ matrix.target }}
      # Windows: a code-signing certificate (base64 .pfx) in the store, its
      # thumbprint handed to the bundler. Skipped when the secret isn't set.
      - name: Import the Windows signing certificate
        if: runner.os == 'Windows'
        id: wincert
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Output "unsigned: no WINDOWS_CERTIFICATE secret"; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
      # macOS: the bundler signs with APPLE_CERTIFICATE and notarises with
      # APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID when they're set.
      - name: Build and bundle
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          THUMBPRINT: ${{ steps.wincert.outputs.thumbprint }}
        run: |
          args=(--target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json)
          if [ -n "$THUMBPRINT" ]; then
            args+=(--config "{\"bundle\":{\"windows\":{\"certificateThumbprint\":\"$THUMBPRINT\"}}}")
          fi
          pnpm --filter @skyla/desktop tauri build "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  publish:
    name: draft release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-cyclonedx
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Collect the bundles with SHA256SUMS and latest.json
        run: cargo run -q --locked -p skyla-release -- collect artifacts dist "$GITHUB_REF_NAME" "$(date -u +%F)"
      - name: SBOM (CycloneDX) of the Rust dependencies
        run: |
          cargo cyclonedx --manifest-path apps/desktop/src-tauri/Cargo.toml --format json --override-filename sbom
          cp apps/desktop/src-tauri/sbom.json dist/sky-la-sbom.cdx.json
      # The release key signs SHA256SUMS (which covers every bundle) and the
      # update manifest. Without the secret, the release stays unsigned and
      # the app's update check (which needs a signed manifest) ignores it.
      - name: Sign with the release key
        env:
          SKYLA_RELEASE_KEY: ${{ secrets.SKYLA_RELEASE_KEY }}
          SKYLA_RELEASE_KEY_PASSWORD: ${{ secrets.SKYLA_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$SKYLA_RELEASE_KEY" ]; then echo "unsigned: no SKYLA_RELEASE_KEY secret"; exit 0; fi
          cargo run -q --locked -p skyla-release -- sign dist/SHA256SUMS dist/latest.json
      - run: cargo run -q --locked -p skyla-release -- verify-sums dist
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## $version" '$0==h{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "sky-la $version" --notes-file notes.md dist/*
