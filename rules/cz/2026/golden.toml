# Golden cases for the CZ 2026 pack: what it must answer, worked out by
# hand from the cited provisions (see rules/README.md). Run with
# `just pack-check rules/cz/2026`. Every value, VAT code, obligation and
# holiday needs a case.
#
# Written by the pack's author, so they confirm the pack rather than
# review it independently; the pack stays "draft" until a second person
# re-derives these cases from the official texts.

