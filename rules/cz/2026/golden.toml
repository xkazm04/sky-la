# ── Deadlines ─────────────────────────────────────────────────────────────

[[deadline]]
obligation = "vat.return.monthly"
period = "2026-03"
due = "2026-04-27"  # 31 March + 25 days = Saturday 25 April, so Monday

[[deadline]]
obligation = "vat.return.monthly"
period = "2026-08"
due = "2026-09-25"  # a Friday

[[deadline]]
obligation = "vat.control_statement.monthly"
period = "2026-03"
due = "2026-04-27"  # as the return

[[deadline]]
