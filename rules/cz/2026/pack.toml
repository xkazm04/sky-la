kind = "amount"
value = "1200"
effective_from = "2014-01-01"
cite = { act = "nv351", section = "§ 3" }
note = "Minimum cost of recovering each receivable that a creditor may claim from a business debtor."

# ── Deadlines ──────────────────────────────────────────────────────────────

[[value]]
key = "deadline.shift_to_next_working_day"
kind = "flag"
value = "true"
effective_from = "2011-01-01"
cite = { act = "dr", section = "§ 33 odst. 4" }
note = "A deadline ending on a Saturday, Sunday or public holiday moves to the next working day."

# ── Obligations (the calendar) ─────────────────────────────────────────────
# `applies_to` names entity facts: `osvc` (self-employed person),
# `vat_monthly` / `vat_quarterly` (VAT payer by tax period). Deadlines move
# to the next working day by `deadline.shift_to_next_working_day`.

[[obligation]]
id = "vat.return.monthly"
name = "DPH return and payment"
action = "file_and_pay"
applies_to = ["vat_monthly"]
frequency = "monthly"
due = { days_after_period = "vat.return.due_days_after_period" }
cite = { act = "zdph", section = "§ 101 odst. 1" }

[[obligation]]
id = "vat.control_statement.monthly"
name = "Kontrolní hlášení"
action = "file"
applies_to = ["vat_monthly"]
frequency = "monthly"
due = { days_after_period = "vat.control_statement.due_days_after_period" }
cite = { act = "zdph", section = "§ 101e odst. 1" }

[[obligation]]
id = "income_tax.return.paper"
name = "Income tax return (DPFO), on paper"
action = "file_and_pay"
applies_to = ["osvc"]
frequency = "yearly"
due = { month_offset = 4, day = 1 }
cite = { act = "dr", section = "§ 136 odst. 1; běh lhůty § 33 odst. 2" }
note = "Three months after the year ends: 1 April."

[[obligation]]
id = "income_tax.return.electronic"
name = "Income tax return (DPFO), filed electronically"
action = "file_and_pay"
applies_to = ["osvc"]
frequency = "yearly"
due = { month_offset = 5, day = 1 }
cite = { act = "dr", section = "§ 136 odst. 2 písm. c)" }
note = "One month later when filed electronically (or by a tax adviser, three months later still)."

[[obligation]]
id = "insurance.social.advance"
name = "Social insurance advance"
action = "pay"
applies_to = ["osvc"]
frequency = "monthly"
due = { month_offset = 1, day = 20 }
cite = { act = "zos", section = "§ 14a odst. 2" }
note = "The advance for a month is due by the 20th of the next month."

[[obligation]]
id = "insurance.health.advance"
name = "Health insurance advance"
action = "pay"
applies_to = ["osvc"]
frequency = "monthly"
due = { month_offset = 1, day = 8 }
cite = { act = "zvzp", section = "§ 7 odst. 1 písm. b)" }
note = "The advance for a month is due by the 8th of the next month."

# ── VAT codes and the return's rows ────────────────────────────────────────
# A posting's vat_code names one of these. `rows` map its base and tax onto
# the DPH return (DPHDP3); `credit_positive` shows credits as positive.

[[vat_code]]
code = "OUT21"
name = "Domestic supply, standard rate"
rate = "vat.rate.standard"
cite = { act = "dphdp3", section = "ř. 1" }
rows = [
  { row = "1", part = "base", credit_positive = true },
  { row = "1", part = "tax", credit_positive = true },
]
einvoice = { category = "S" }

[[vat_code]]
code = "OUT12"
name = "Domestic supply, reduced rate"
rate = "vat.rate.reduced"
cite = { act = "dphdp3", section = "ř. 2" }
rows = [
  { row = "2", part = "base", credit_positive = true },
  { row = "2", part = "tax", credit_positive = true },
]
einvoice = { category = "S" }

[[vat_code]]
code = "NOVAT"
name = "Supply by a person not registered for VAT"
rate = "vat.rate.none"
cite = { act = "zdph", section = "§ 6" }
rows = []
outside_vat = true
einvoice = { category = "O", exemption_reason = "Dodavatel není plátcem DPH (§ 6 zákona o DPH)." }

[[vat_code]]
code = "RC21S"
name = "Service received from another member state, standard rate (reverse charge)"
rate = "vat.rate.standard"
cite = { act = "dphdp3", section = "ř. 5 a ř. 43" }
rows = [
  { row = "5", part = "base", credit_positive = false },
  { row = "5", part = "tax_credit", credit_positive = true },
  { row = "43", part = "base", credit_positive = false },
  { row = "43", part = "tax_debit", credit_positive = false },
]

[[vat_code]]
code = "RC12S"
name = "Service received from another member state, reduced rate (reverse charge)"
rate = "vat.rate.reduced"
cite = { act = "dphdp3", section = "ř. 6 a ř. 44" }
rows = [
  { row = "6", part = "base", credit_positive = false },
  { row = "6", part = "tax_credit", credit_positive = true },
  { row = "44", part = "base", credit_positive = false },
  { row = "44", part = "tax_debit", credit_positive = false },
]

[[vat_code]]
code = "IN21"
name = "Domestic purchase, standard rate (input VAT)"
rate = "vat.rate.standard"
cite = { act = "dphdp3", section = "ř. 40" }
rows = [
  { row = "40", part = "base", credit_positive = false },
  { row = "40", part = "tax", credit_positive = false },
]

[[vat_code]]
code = "IN12"
name = "Domestic purchase, reduced rate (input VAT)"
rate = "vat.rate.reduced"
cite = { act = "dphdp3", section = "ř. 41" }
rows = [
  { row = "41", part = "base", credit_positive = false },
  { row = "41", part = "tax", credit_positive = false },
]

