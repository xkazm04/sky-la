# sky-la rule pack: Czech Republic, 2026.
#
# Every value is effective-dated and cites the provision it comes from.
# Logic never hard-codes a rate, threshold or deadline; it asks the pack.
#
# Review status is "draft": values were compiled from the cited provisions
# but haven't yet been checked line by line against the official consolidated
# texts by a second person. The app shows the status next to every figure
# that depends on the pack. Values the compiler wasn't sure of are left out
# (see `[pack].omitted`) rather than guessed.

[pack]
id = "cz-2026"
version = "2026.1"
jurisdiction = "CZ"
valid_from = "2026-01-01"
valid_to = "2026-12-31"
review = "draft"
currency = "CZK"
summary = "VAT, income-tax basics, thresholds, deadlines and VAT-return row mapping for Czech freelancers (OSVČ) and micro-companies."
omitted = [
  "income_tax.solidarity_threshold (36 × the 2026 average wage): needs the 2026 average-wage regulation",
  "social and health insurance minimum advances for 2026: need the 2026 regulation",
  "paušální daň bands for 2026: need the 2026 amounts",
  "ČNB repo rate: reference data (imported or fetched), not statutory pack data",
]

[[act]]
id = "zdph"
name = "Zákon č. 235/2004 Sb., o dani z přidané hodnoty"
url = "https://www.zakonyprolidi.cz/cs/2004-235"

[[act]]
id = "zdp"
name = "Zákon č. 586/1992 Sb., o daních z příjmů"
url = "https://www.zakonyprolidi.cz/cs/1992-586"

[[act]]
id = "dr"
name = "Zákon č. 280/2009 Sb., daňový řád"
url = "https://www.zakonyprolidi.cz/cs/2009-280"

[[act]]
id = "nv351"
name = "Nařízení vlády č. 351/2013 Sb., kterým se určuje výše úroků z prodlení a nákladů spojených s uplatněním každé pohledávky"
url = "https://www.zakonyprolidi.cz/cs/2013-351"

[[act]]
id = "svatky"
name = "Zákon č. 245/2000 Sb., o státních svátcích, o ostatních svátcích, o významných dnech a o dnech pracovního klidu"
url = "https://www.zakonyprolidi.cz/cs/2000-245"

[[act]]
id = "dphdp3"
name = "Pokyny k vyplnění přiznání k dani z přidané hodnoty (tiskopis 25 5401, EPO DPHDP3)"
url = "https://adisspr.mfcr.cz/dpr/adis/idpr_pub/epo2_info/popis_struktury_detail.faces?zkratka=DPHDP3"

# ── VAT ────────────────────────────────────────────────────────────────────

[[value]]
key = "vat.rate.standard"
kind = "percent"
value = "21"
effective_from = "2013-01-01"
cite = { act = "zdph", section = "§ 47 odst. 1 písm. a)" }

[[value]]
key = "vat.rate.none"
kind = "percent"
value = "0"
effective_from = "2004-05-01"
cite = { act = "zdph", section = "§ 6 (osoba, která není plátcem, daň neuplatňuje)" }

[[value]]
key = "vat.rate.reduced"
kind = "percent"
value = "15"
effective_from = "2015-01-01"
effective_to = "2023-12-31"
cite = { act = "zdph", section = "§ 47 odst. 1 písm. b), ve znění do 31. 12. 2023" }
note = "Until 2023 there were two reduced rates (15 % and 10 %); the 2024 consolidation merged them into 12 %."

[[value]]
key = "vat.rate.reduced"
kind = "percent"
value = "12"
effective_from = "2024-01-01"
cite = { act = "zdph", section = "§ 47 odst. 1 písm. b), ve znění zákona č. 349/2023 Sb." }

[[value]]
key = "vat.rounding.document"
kind = "rounding"
value = "half_up"
effective_from = "2013-01-01"
cite = { act = "zdph", section = "§ 37 odst. 1 (výpočet daně); zaokrouhlení na haléře" }
note = "Tax on a document is computed per rate and rounded to the haléř, half up."

[[value]]
key = "vat.registration.threshold"
kind = "amount"
value = "2000000.00"
effective_from = "2025-01-01"
cite = { act = "zdph", section = "§ 6 odst. 1, ve znění zákona č. 471/2024 Sb." }
note = "Turnover in a calendar year. Exceeding it makes the business a VAT payer from the next year."

[[value]]
key = "vat.return.due_days_after_period"
kind = "days"
value = "25"
effective_from = "2013-01-01"
cite = { act = "zdph", section = "§ 101 odst. 1" }

[[value]]
key = "vat.control_statement.due_days_after_period"
kind = "days"
value = "25"
effective_from = "2016-01-01"
cite = { act = "zdph", section = "§ 101e odst. 1" }

[[value]]
key = "vat.control_statement.itemise_above"
kind = "amount"
value = "10000.00"
effective_from = "2016-01-01"
cite = { act = "zdph", section = "§ 101c; pokyny ke kontrolnímu hlášení, oddíly A.4 a B.2" }
note = "Documents above 10 000 Kč including VAT are listed one by one (A.4, B.2); smaller ones are summed (A.5, B.3)."

