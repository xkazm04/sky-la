[[value]]
key = "income_tax.flat_rate.craft.cap"
kind = "amount"
value = "1600000.00"
effective_from = "2021-01-01"
cite = { act = "zdp", section = "§ 7 odst. 7 písm. a)" }

[[value]]
key = "income_tax.flat_rate.liberal.percent"
kind = "percent"
value = "40"
effective_from = "2021-01-01"
cite = { act = "zdp", section = "§ 7 odst. 7 písm. c)" }

[[value]]
key = "income_tax.flat_rate.liberal.cap"
kind = "amount"
value = "800000.00"
effective_from = "2021-01-01"
cite = { act = "zdp", section = "§ 7 odst. 7 písm. c)" }

[[value]]
key = "assets.tangible.threshold"
kind = "amount"
value = "80000.00"
effective_from = "2021-01-01"
cite = { act = "zdp", section = "§ 26 odst. 2 písm. a)" }
note = "Tangible assets above this price, with a useful life over one year, are depreciated; cheaper ones are expensed."

# ── Late-payment interest ──────────────────────────────────────────────────

[[value]]
key = "late_interest.margin_pp"
kind = "percent"
value = "8"
effective_from = "2014-01-01"
cite = { act = "nv351", section = "§ 2" }
note = "Annual rate = ČNB repo rate valid on the first day of the calendar half-year in which the delay began, plus this margin."

# ── Deadlines ──────────────────────────────────────────────────────────────

[[value]]
key = "deadline.shift_to_next_working_day"
kind = "flag"
value = "true"
effective_from = "2011-01-01"
cite = { act = "dr", section = "§ 33 odst. 4" }
note = "A deadline ending on a Saturday, Sunday or public holiday moves to the next working day."

# ── VAT codes and the return's rows ────────────────────────────────────────
# A posting's vat_code names one of these. `rows` map its base and tax onto
# the DPH return (DPHDP3); `credit_positive` shows credits as positive.

[[vat_code]]
code = "OUT21"
name = "Domestic supply, standard rate"
rate = "vat.rate.standard"
cite = { act = "dphdp3", section = "ř. 1" }
rows = [
  { row = "1", part = "base", credit_positive = true },
  { row = "1", part = "tax", credit_positive = true },
]

[[vat_code]]
code = "OUT12"
name = "Domestic supply, reduced rate"
rate = "vat.rate.reduced"
cite = { act = "dphdp3", section = "ř. 2" }
rows = [
  { row = "2", part = "base", credit_positive = true },
  { row = "2", part = "tax", credit_positive = true },
]

[[vat_code]]
code = "NOVAT"
name = "Supply by a person not registered for VAT"
rate = "vat.rate.none"
cite = { act = "zdph", section = "§ 6" }
rows = []
outside_vat = true

[[vat_code]]
code = "RC21S"
name = "Service received from another member state, standard rate (reverse charge)"
rate = "vat.rate.standard"
cite = { act = "dphdp3", section = "ř. 5 a ř. 43" }
rows = [
  { row = "5", part = "base", credit_positive = false },
  { row = "5", part = "tax_credit", credit_positive = true },
  { row = "43", part = "base", credit_positive = false },
  { row = "43", part = "tax_debit", credit_positive = false },
]

[[vat_code]]
code = "RC12S"
name = "Service received from another member state, reduced rate (reverse charge)"
rate = "vat.rate.reduced"
cite = { act = "dphdp3", section = "ř. 6 a ř. 44" }
rows = [
  { row = "6", part = "base", credit_positive = false },
  { row = "6", part = "tax_credit", credit_positive = true },
  { row = "44", part = "base", credit_positive = false },
  { row = "44", part = "tax_debit", credit_positive = false },
]

[[vat_code]]
code = "IN21"
name = "Domestic purchase, standard rate (input VAT)"
rate = "vat.rate.standard"
cite = { act = "dphdp3", section = "ř. 40" }
rows = [
  { row = "40", part = "base", credit_positive = false },
  { row = "40", part = "tax", credit_positive = false },
]

[[vat_code]]
code = "IN12"
name = "Domestic purchase, reduced rate (input VAT)"
rate = "vat.rate.reduced"
cite = { act = "dphdp3", section = "ř. 41" }
rows = [
  { row = "41", part = "base", credit_positive = false },
  { row = "41", part = "tax", credit_positive = false },
]

