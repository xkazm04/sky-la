# ── Categories: what freelancers see instead of account numbers ────────────
# tax_treatment is the default for new postings; a posting can override it.
#   taxable          income included in the tax base
#   deductible       expense reducing the tax base
#   non_deductible   expense kept out of the tax base (e.g. §25 ZDP)
#   not_tax_relevant neither income nor expense (owner's money)

