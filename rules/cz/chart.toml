# Czech chart of accounts for sky-la entities (OSVČ and s.r.o.).
#
# Source: the "směrná účtová osnova" for entrepreneurs under vyhláška
# č. 500/2002 Sb., which fixes the account classes and groups. The three-digit
# synthetic accounts are the customary model chart built on those groups.
# Entities add analytic accounts (e.g. 221.001 for one bank account) under
# these; an account with children can no longer be posted to.
#
# kind:        asset | liability | equity | revenue | expense | closing
# normal_side: debit | credit. Assets are debit-normal and liabilities, revenue
#              credit-normal, except accounts marked `contra = true` (accumulated
#              depreciation 07x/08x). Equity and closing accounts may be either.

id = "cz-chart"
version = "2026.1"
citation = "vyhláška č. 500/2002 Sb., směrná účtová osnova pro podnikatele"

