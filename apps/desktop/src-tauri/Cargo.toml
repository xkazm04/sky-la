[package]
name = "skyla-desktop"
description = "sky-la desktop shell (Tauri v2)."
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# The installed program is called sky-la.
[[bin]]
name = "sky-la"
path = "src/main.rs"

[lib]
name = "skyla_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
skyla-advisor = { version = "0.1.0", path = "../../../crates/skyla-advisor" }
skyla-app = { version = "0.1.0", path = "../../../crates/skyla-app" }
skyla-store = { version = "0.1.0", path = "../../../crates/skyla-store", features = ["os-keychain"] }
# Pinned: tauri-specta and specta 2 are release candidates (STATUS backlog).
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[dev-dependencies]
serde_json = "1"
tauri = { version = "2", features = ["test"] }

[lints]
workspace = true
