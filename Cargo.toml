[workspace]
resolver = "3"
members = [
    "crates/skyla-money",
    "crates/skyla-ledger",
    "crates/skyla-store",
    "crates/skyla-rules",
    "crates/skyla-tax-cz",
    "crates/skyla-invoicing",
    "crates/skyla-render",
    "crates/skyla-bank",
    "crates/skyla-egress",
    "crates/skyla-advisor",
    "crates/skyla-mcp",
    "crates/skyla-app",
    "apps/desktop/src-tauri",
]
# The desktop crate needs WebKitGTK on Linux. Everything `just ci` checks
# builds without it; `just check-desktop` covers the shell.
default-members = [
    "crates/skyla-money",
    "crates/skyla-ledger",
    "crates/skyla-store",
    "crates/skyla-rules",
    "crates/skyla-tax-cz",
    "crates/skyla-invoicing",
    "crates/skyla-render",
    "crates/skyla-bank",
    "crates/skyla-egress",
    "crates/skyla-advisor",
    "crates/skyla-mcp",
    "crates/skyla-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/xkazm04/sky-la"
authors = ["sky-la contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
