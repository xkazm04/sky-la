# cargo-deny policy. Run with `just deny`; CI runs it on every push.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Every exception names one advisory, says why it can't be fixed here, and when to revisit it.
ignore = [
    # "Unmaintained" notice, not a vulnerability. proc-macro-error is a build-time
    # proc-macro reached only through Tauri's Linux GTK3 stack
    # (gtk-rs 0.18 -> glib-macros). No upgrade exists until Tauri leaves gtk-rs 0.18.
    # Revisit on every Tauri minor upgrade.
    { id = "RUSTSEC-2024-0370", reason = "transitive build-time dep of Tauri's GTK3 stack; no upgrade available" },
    # "Unmaintained" notice, not a vulnerability. paste is a build-time
    # proc-macro reached only through specta (the IPC type exporter, WP-09).
    # Revisit when specta 2 leaves release candidates.
    { id = "RUSTSEC-2024-0436", reason = "build-time proc-macro of specta; no maintained replacement upstream yet" },
]

[licenses]
version = 2
# Third-party licences compatible with both the AGPL application and the
# Apache-2.0 engine crates. Extend deliberately, never with copyleft licences.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# Workspace crates are skipped here; scripts/check_licence_boundary.py governs them.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
